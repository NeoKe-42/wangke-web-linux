<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0c0c0c" />
		<meta
			name="description"
			content="WangKe Web Linux — a real Debian Linux terminal running entirely inside your browser via WebAssembly (WebVM / CheerpX). No remote SSH server."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="dns-prefetch" href="https://cxrtnc.leaningtech.com" />
		<link rel="preconnect" href="https://cxrtnc.leaningtech.com" crossorigin />
		<title>WangKe Web Linux</title>
		<!-- Service worker that adds COOP/COEP headers so SharedArrayBuffer works
		     even on hosts (like GitHub Pages) that cannot set response headers. -->
		<script src="%sveltekit.assets%/serviceWorker.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
